<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Submitted</title>
    <meta name="description" content="Thank you for submitting your Review">
    <meta name="author" content="Teckler N Makomeke">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script>
        // Count reviews
        let reviewCount = localStorage.getItem('reviewCount');
        reviewCount = reviewCount ? parseInt(reviewCount) + 1 : 1;
        localStorage.setItem('reviewCount', reviewCount);
        window.onload = () => {
            document.querySelector('#count').textContent = reviewCount;
        }
    </script>
</head>
<body>
    <h1>Thank you for your  review</h1>
    <p>You have completed <span id="count">0</span> reviews.</p>
    <a href="form.html">Submit another review</a>
</body>
</html>
